name: Deploy update of BlockWall Calculator

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRV_KEY }}
          script: |
            cd /home/projects/tools/blockwallcalculator/blockwallcalculator
            git pull
            npm install
            npm run build